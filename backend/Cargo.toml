[package]
name = "brikrs"
version = "0.16.2"
edition = "2024"
description = "Notion ライクな軽量 wiki / ミニブログ"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["macros", "multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
captcha = { version = "1.0.0", default-features = false }
chrono = { version = "0.4.45", features = ["serde"] }
cookie = "0.18"
dotenvy = "0.15.7"
encoding_rs = "0.8"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots"] }
pulldown-cmark = { version = "0.13.5", default-features = false }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sea-orm = { version = "2.0.4", default-features = false, features = ["sqlx-mysql", "runtime-tokio-rustls", "macros", "with-chrono", "with-json"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["sqlx-mysql", "runtime-tokio-rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "limit", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2"
webpki-roots = "1"
